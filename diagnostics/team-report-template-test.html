<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Report Squadra · Squadra Leonora · Maggio 2026</title>
    <style>
      :root {
        --paper: #fbfbfb;
        --page: #ffffff;
        --ink: #121212;
        --ink-2: #3d3d3d;
        --ink-3: #7d7d7d;
        --line: #d6d6d6;
        --line-2: #e9e9e9;
        --panel: #fafafa;
        --empty: #f6f6f6;
        --rest: #f1f1f1;
        --accent: #111111;
        --accent-2: #666666;
      }

      * {
        box-sizing: border-box;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      @page {
        size: A4 portrait;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      body {
        min-height: auto;
        display: block;
      }

      .page {
        width: 210mm;
        height: 295.5mm;
        margin: 0 auto;
        background: var(--page);
        padding: 7.5mm 8.5mm 6mm;
        display: flex;
        flex-direction: column;
        gap: 3mm;
        overflow: hidden;
      }

      .header {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: end;
        gap: 6mm;
        padding-bottom: 2.2mm;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-size: 14pt;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: lowercase;
      }

      .title .t1 {
        font-size: 15.5pt;
        line-height: 1.05;
        font-weight: 500;
      }

      .title .t2 {
        margin-top: 1mm;
        font-size: 7.2pt;
        color: var(--ink-3);
        letter-spacing: 0.04em;
      }

      .meta {
        text-align: right;
      }

      .meta > div:first-child {
        font-size: 6.5pt;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--ink-3);
      }

      .period {
        margin-top: 0.8mm;
        font-size: 9pt;
        font-weight: 600;
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3mm;
      }

      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3mm;
        padding: 2.4mm;
        min-height: 24mm;
      }

      .kpi.accent {
        background: #111111;
        color: #ffffff;
      }

      .kpi .label {
        font-size: 6.4pt;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--ink-3);
      }

      .kpi.accent .label {
        color: rgba(255, 255, 255, 0.7);
      }

      .kpi .value {
        margin-top: 0.9mm;
        font-size: 14pt;
        line-height: 1.05;
        font-weight: 600;
      }

      .kpi .value .unit {
        font-size: 8pt;
        font-weight: 500;
        margin-left: 0.8mm;
      }

      .kpi .note {
        margin-top: 1.1mm;
        font-size: 6.1pt;
        line-height: 1.28;
        color: var(--ink-3);
      }

      .kpi.accent .note {
        color: rgba(255, 255, 255, 0.76);
      }

      .sec-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 1.1mm;
        border-bottom: 1px solid var(--line);
        margin-bottom: 1.1mm;
      }

      .sec-head h2 {
        font-size: 7pt;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-weight: 700;
        color: var(--ink);
      }

      .sec-head .desc {
        font-size: 6.8pt;
        color: var(--ink-3);
      }

      .calendar {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3mm;
        padding: 2.4mm;
        display: flex;
        flex-direction: column;
      }

      .cal-grid {
        display: grid;
        grid-template-columns: 7mm repeat(7, 1fr);
        grid-auto-rows: minmax(0, 16.2mm);
        gap: 1mm;
      }

      .cal-head {
        font-size: 6.2pt;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-3);
        text-align: center;
        font-weight: 500;
        min-height: 4mm;
      }

      .cal-head.wkn {
        text-align: left;
      }

      .wk-label {
        font-size: 6.2pt;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        letter-spacing: 0.05em;
      }

      .day {
        background: var(--empty);
        border: 1px solid var(--line-2);
        border-radius: 1.5mm;
        padding: 1mm 1.2mm;
        display: flex;
        flex-direction: column;
        gap: 0.2mm;
        position: relative;
        min-height: 0;
        overflow: hidden;
      }

      .day.outside {
        background: transparent;
        border-color: transparent;
      }

      .day .dnum {
        font-size: 6.9pt;
        color: var(--ink-2);
        letter-spacing: 0.03em;
        font-weight: 500;
      }

      .day.has-work {
        background: #fff;
        border-color: var(--line);
      }

      .day.has-work .crew {
        font-size: 7.5pt;
        font-weight: 700;
        color: var(--ink);
        font-style: italic;
      }

      .day.has-work .eq {
        font-size: 5.4pt;
        color: var(--ink-2);
      }

      .day.has-work .hrs {
        margin-top: auto;
        font-size: 6pt;
        color: var(--ink-2);
      }

      .day.has-work .hrs strong {
        color: var(--ink);
        font-weight: 700;
        font-size: 7pt;
      }

      .day.rest {
        background: var(--rest);
        border-color: var(--line);
      }

      .day.rest .lbl {
        margin: auto;
        font-size: 5.8pt;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--ink-3);
      }

      .day.empty .lbl {
        margin: auto;
        font-size: 9pt;
        color: #cfcfcf;
      }

      .day.has-work::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 1.2mm;
        background: var(--accent-2);
        opacity: 0.9;
        border-radius: 1.5mm 0 0 1.5mm;
      }

      .day.has-work.heavy::before {
        background: var(--accent);
      }

      .day.has-work.light::before {
        background: #b8b8b8;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4mm;
        padding-top: 1.5mm;
        margin-top: 1.5mm;
        border-top: 1px dashed var(--line);
        font-size: 5.9pt;
        color: var(--ink-2);
        align-items: center;
      }

      .legend .item {
        display: flex;
        align-items: center;
        gap: 1.5mm;
      }

      .legend .sw {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: #fff;
        border: 1px solid var(--line);
        position: relative;
        overflow: hidden;
      }

      .legend .sw::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--accent-2);
      }

      .legend .sw.heavy::before {
        background: var(--accent);
      }

      .legend .sw.light::before {
        background: #b8b8b8;
      }

      .legend .sw.rest {
        background: var(--rest);
      }

      .legend .sw.rest::before {
        display: none;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 3mm;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .breakdown {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3mm;
        overflow: hidden;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4mm;
        padding: 1.9mm 2.5mm;
        align-items: center;
        border-bottom: 1px solid var(--line-2);
      }

      .row:last-child {
        border-bottom: none;
      }

      .row .lhs .title {
        font-weight: 600;
        font-size: 7.6pt;
      }

      .row .lhs .sub {
        font-size: 6.1pt;
        color: var(--ink-3);
        margin-top: 0.2mm;
      }

      .row .amt {
        font-size: 9.3pt;
        font-weight: 500;
        white-space: nowrap;
      }

      .row .amt.pos,
      .row .amt.neg {
        color: var(--ink);
      }

      .row.total {
        background: var(--ink);
        color: #ffffff;
      }

      .row.total .lhs .title {
        font-size: 8.5pt;
        color: #ffffff;
      }

      .row.total .lhs .sub {
        color: rgba(255, 255, 255, 0.75);
      }

      .row.total .amt {
        font-size: 13pt;
        font-weight: 700;
        color: #ffffff;
      }

      .table-wrap {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3mm;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 1.05mm 2.2mm;
        text-align: left;
        font-size: 6.7pt;
      }

      thead th {
        background: #f0f0f0;
        color: var(--ink-3);
        font-size: 5.9pt;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        padding-top: 1.6mm;
        padding-bottom: 1.6mm;
      }

      th.num,
      td.num {
        text-align: right;
        white-space: nowrap;
      }

      tbody tr {
        border-bottom: 1px solid var(--line-2);
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      tbody td .nm {
        font-weight: 500;
      }

      tbody td .ix {
        display: inline-block;
        width: 6mm;
        color: var(--ink-3);
        font-size: 6.1pt;
      }

      tbody tr.totalrow {
        background: #f0f0f0;
        border-top: 1px solid var(--line);
      }

      tbody tr.totalrow td {
        font-weight: 700;
        padding-top: 1.6mm;
        padding-bottom: 1.6mm;
      }

      tbody tr.totalrow td.num {
        color: var(--ink);
        font-size: 8pt;
      }

      .footnote {
        font-size: 5.8pt;
        color: var(--ink-3);
        display: flex;
        justify-content: space-between;
        letter-spacing: 0.04em;
        padding-top: 1.1mm;
        border-top: 1px solid var(--line);
        margin-top: auto;
      }

      @media print {
        html,
        body {
          background: white;
        }

        .page {
          margin: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      function esc(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderDayCell(day) {
        if (!day || day.type === 'outside') {
          return '<div class="day outside"></div>';
        }

        if (day.type === 'work') {
          return [
            '<div class="day has-work ', esc(day.intensity || ''), '">',
            '<div class="dnum">', esc(day.dateLabel), '</div>',
            '<div class="crew">', esc(day.mainLabel), '</div>',
            '<div class="eq">', esc(day.eqLabel), '</div>',
            '<div class="hrs"><strong>', esc(day.hoursValueLabel), '</strong> h</div>',
            '</div>',
          ].join('');
        }

        if (day.type === 'rest') {
          return [
            '<div class="day rest">',
            '<div class="dnum">', esc(day.dateLabel), '</div>',
            '<div class="lbl">', esc(day.restLabel || 'Riposo'), '</div>',
            '</div>',
          ].join('');
        }

        return [
          '<div class="day empty">',
          '<div class="dnum">', esc(day.dateLabel), '</div>',
          '<div class="lbl">·</div>',
          '</div>',
        ].join('');
      }

      function renderCalendar(calendario) {
        var headers = (calendario.headers || []).map(function(label, index) {
          var extra = index === 0 ? ' wkn' : '';
          return '<div class="cal-head' + extra + '">' + esc(label) + '</div>';
        }).join('');

        var weeks = (calendario.weeks || []).map(function(week) {
          var days = (week.days || []).map(renderDayCell).join('');
          return '<div class="wk-label">' + esc(week.label) + '</div>' + days;
        }).join('');

        var legend = (calendario.legend || []).map(function(item) {
          if (item.type === 'text') {
            return '<div class="item">' + esc(item.label) + '</div>';
          }
          return '<div class="item"><span class="sw ' + esc(item.className || '') + '"></span>' + esc(item.label) + '</div>';
        }).join('');

        return [
          '<div class="sec-head"><h2>Presenze del mese</h2><div class="desc">Formato: <strong>persone × ore per persona</strong></div></div>',
          '<div class="calendar">',
          '<div class="cal-grid">',
          headers,
          weeks,
          '</div>',
          '<div class="legend">', legend, '</div>',
          '</div>',
        ].join('');
      }

      function renderBreakdown(compenso) {
        var rows = (compenso.rows || []).map(function(row) {
          var amountClass = row.kind === 'total' ? '' : (row.sign === '+' ? ' pos' : row.sign === '-' ? ' neg' : '');
          var rowClass = row.kind === 'total' ? 'row total' : 'row';
          return [
            '<div class="', rowClass, '">',
            '<div class="lhs"><div class="title">', esc(row.title), '</div><div class="sub">', esc(row.sub || ''), '</div></div>',
            '<div class="amt', amountClass, '">', esc(row.amountLabel), '</div>',
            '</div>',
          ].join('');
        }).join('');

        return [
          '<div class="sec-head"><h2>Compenso · dettaglio</h2><div class="desc">Voci del saldo</div></div>',
          '<div class="breakdown">', rows, '</div>',
        ].join('');
      }

      function renderComponents(componenti) {
        var rows = (componenti.items || []).map(function(item) {
          return [
            '<tr>',
            '<td><span class="ix">', esc(item.indexLabel), '</span><span class="nm">', esc(item.label), '</span></td>',
            '<td>', esc(item.selectedDaysLabel || '-'), '</td>',
            '<td class="num">', esc(item.daysLabel), '</td>',
            '<td class="num">', esc(item.amountLabel), '</td>',
            '</tr>',
          ].join('');
        }).join('');

        return [
          '<div class="sec-head"><h2>Acconti e buste componenti</h2><div class="desc">', esc(componenti.summaryLabel || ''), '</div></div>',
          '<div class="table-wrap">',
          '<table>',
          '<thead><tr><th style="width:48%">Componente</th><th style="width:24%">Date busta</th><th class="num">Gg</th><th class="num">Importo</th></tr></thead>',
          '<tbody>',
          rows,
          '<tr class="totalrow"><td colspan="2">Totale</td><td class="num">', esc(componenti.totalDaysLabel), '</td><td class="num">', esc(componenti.totalAmountLabel), '</td></tr>',
          '</tbody>',
          '</table>',
          '</div>',
        ].join('');
      }

      window.loadData = function(data) {
        var calendario = data.calendario || {};
        var compenso = data.compenso || {};
        var componenti = data.componenti || {};
        var riepilogo = data.riepilogo || {};
        var meta = data.meta || {};

        document.title = data.title || 'Report squadra';

        document.getElementById('app').innerHTML = [
          '<div class="page">',
          '<header class="header">',
          '<div class="brand">', esc(meta.brandMark || data.brandMark || 'gpa'), '</div>',
          '<div class="title"><div class="t1">', esc(meta.title || 'Report mensile squadra'), '</div><div class="t2">', esc(meta.subtitle || 'Rendicontazione presenze e compenso'), '</div></div>',
          '<div class="meta"><div>Periodo</div><div class="period">', esc(meta.periodLabel || ''), '</div></div>',
          '</header>',

          '<div class="kpis">',
          '<div class="kpi"><div class="label">Calcolo giornate</div><div class="value">', esc(riepilogo.workedSummaryLabel), '</div><div class="note">', esc(riepilogo.workedSummaryNoteLine1 || ''), '<br>', esc(riepilogo.workedSummaryNoteLine2 || ''), '</div></div>',
          '<div class="kpi"><div class="label">Ore totali lavorate</div><div class="value">', esc(riepilogo.totalHoursValue), '<span class="unit">h</span></div><div class="note">', esc(riepilogo.totalHoursNoteLine1 || ''), '<br>', esc(riepilogo.totalHoursNoteLine2 || ''), '</div></div>',
          '<div class="kpi accent"><div class="label">Compenso squadra</div><div class="value">', esc(riepilogo.compensationValue), '</div><div class="note">', esc(riepilogo.compensationNoteLine1 || ''), '<br>', esc(riepilogo.compensationNoteLine2 || ''), '</div></div>',
          '</div>',

          renderCalendar(calendario),

          '<div class="two-col">',
          '<div class="col">', renderBreakdown(compenso), '</div>',
          '<div class="col">', renderComponents(componenti), '</div>',
          '</div>',

          '<div class="footnote"><div>', esc(meta.footerLeft || ''), '</div><div>', esc(meta.footerRight || ''), '</div></div>',
          '</div>',
        ].join('');
      };
    </script>
